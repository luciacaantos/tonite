<script src="../video-01/datos.js"></script>
<script>
// ================= Utilidades =================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fade = (t, a, b) => clamp((t - a) / (b - a));
const suave = (x) => x * x * (3 - 2 * x);
const $ = (id) => document.getElementById(id);
const hx = (h) => [0, 2, 4].map((i) => parseInt(h.replace('#', '').substr(i, 2), 16));
const hex = (r) => '#' + r.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const osc = (h, f) => hex(hx(h).map((v) => v * f));
const acl = (h, f) => hex(hx(h).map((v) => v + (255 - v) * f));
const DEFS = [];
function gl(id, c1, c2, vertical) {
  DEFS.push('<linearGradient id="' + id + '" x1="0" y1="0" x2="' + (vertical ? 0 : 1) + '" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient>');
  return 'url(#' + id + ')';
}
function gr(id, c1, c2, cx = '40%', cy = '35%') {
  DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="75%"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></radialGradient>');
  return 'url(#' + id + ')';
}
DEFS.push('<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>');
DEFS.push('<filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>');
DEFS.push('<filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
const mirror = (s) => '<g transform="scale(-1,1)">' + s + '</g>';

// ================= Personajes =================
// Origen en los pies (0,0); mide unos 800 px de alto a escala 1.
function personaje(id, o) {
  const P = (n) => id + '-' + n;
  const piel = o.piel, pielS = osc(piel, 0.85);
  const fPiel = gr(P('gp'), acl(piel, 0.12), osc(piel, 0.9));
  const fPelo = gl(P('gh'), acl(o.pelo, 0.18), osc(o.pelo, 0.75), true);
  const fPan = gl(P('gpan'), acl(o.pantalon, 0.08), osc(o.pantalon, 0.72));
  const camisa = o.cuero ? '#2a2a2a' : o.camisa;
  const fCam = gl(P('gc'), acl(camisa, 0.12), osc(camisa, 0.78));
  let s = '';
  // Sombra en el suelo
  s += '<ellipse cx="0" cy="0" rx="150" ry="22" fill="#000" opacity=".45" filter="url(#blur8)"/>';
  // Piernas
  s += '<path d="M-74,-400 L-6,-400 L-12,-36 L-68,-36 Z" fill="' + fPan + '"/>';
  s += '<path d="M6,-400 L74,-400 L68,-36 L12,-36 Z" fill="' + fPan + '"/>';
  s += '<path d="M-40,-380 L-40,-50 M40,-380 L40,-50" stroke="' + osc(o.pantalon, 0.65) + '" stroke-width="3" opacity=".55"/>';
  if (o.cuero) s += '<path d="M-64,-220 l44,4 l-8,14 l-34,-3 z M18,-170 l40,2 l-4,12 l-34,-2z" fill="#6b6b6b" opacity=".7"/>';
  // Zapatos
  if (o.zapato === 'bota') {
    const b = '<path d="M-88,0 Q-94,-34 -74,-70 L-12,-70 L-8,0 Z" fill="#161616"/><rect x="-92" y="-10" width="86" height="10" rx="4" fill="#0b0b0b"/><path d="M-60,-62 l20,0 M-62,-50 l22,0 M-64,-38 l24,0" stroke="#3a3a3a" stroke-width="3"/>';
    s += b + mirror(b);
  } else {
    DEFS.push('<linearGradient id="' + P('gz') + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6538"/><stop offset="1" stop-color="#5c3517"/></linearGradient>');
    const z = '<path d="M-92,-6 Q-96,-40 -62,-44 L-10,-44 Q-2,-24 -6,-6 Z" fill="url(#' + P('gz') + ')"/><rect x="-96" y="-12" width="92" height="10" rx="5" fill="#efe4d0"/><path d="M-66,-40 q16,-8 34,0 M-62,-30 q14,-6 28,0" stroke="#e9d3a8" stroke-width="3" fill="none"/><circle cx="-24" cy="-34" r="3" fill="#e9d3a8"/>';
    s += z + mirror(z);
  }
  // Cinturón
  if (!o.cuero) s += '<rect x="-78" y="-414" width="156" height="20" rx="4" fill="#5a3a22"/><rect x="-14" y="-417" width="28" height="26" rx="4" fill="none" stroke="#d9c17a" stroke-width="4"/>';
  // Cuello
  s += '<path d="M-26,-668 L26,-668 L28,-626 Q0,-612 -28,-626 Z" fill="' + pielS + '"/>';
  // Torso (camisa)
  s += '<path d="M-114,-604 Q-126,-566 -106,-522 L-86,-398 L86,-398 L106,-522 Q126,-566 114,-604 Q62,-638 0,-640 Q-62,-638 -114,-604 Z" fill="' + fCam + '"/>';
  if (o.camiseta) {
    s += '<path d="M-34,-636 Q0,-610 34,-636" stroke="' + osc(camisa, 0.6) + '" stroke-width="6" fill="none"/>';
    s += '<path d="M-14,-560 l26,-38 l-8,30 l20,0 l-28,44 l8,-36 z" fill="#c62828"/>';
  }
  // Brazos (giran en el hombro)
  const manga = o.cuero ? '#1c1c1c' : camisa;
  const fManga = gl(P('gm'), acl(manga, 0.1), osc(manga, 0.75));
  function brazo(lado) {
    let b = '';
    if (o.cuero) {
      b += '<path d="M-118,-604 Q-146,-566 -142,-500 L-134,-404 L-100,-402 L-100,-500 L-96,-584 Z" fill="' + fManga + '"/>';
      b += '<rect x="-130" y="-412" width="30" height="12" rx="4" fill="#0e0e0e"/>';
    } else {
      b += '<path d="M-136,-512 L-102,-508 L-104,-404 L-132,-406 Z" fill="' + pielS + '"/>';
      if (o.tatuajes) b += '<path d="M-128,-496 q10,8 20,0 q-10,14 -20,8 M-126,-470 q14,10 22,-2 M-124,-440 q8,6 16,0" stroke="#24406b" stroke-width="4" fill="none" opacity=".85"/>';
      b += '<path d="M-118,-604 Q-144,-566 -140,-508 L-98,-502 L-96,-584 Z" fill="' + fManga + '"/>';
    }
    b += '<ellipse cx="-118" cy="-388" rx="20" ry="24" fill="' + piel + '"/>';
    return '<g id="' + P(lado) + '">' + (lado === 'bD' ? mirror(b) : b) + '</g>';
  }
  s += brazo('bI') + brazo('bD');
  // Polo: cuello y tapeta
  if (o.polo && !o.cuero) {
    s += '<rect x="-8" y="-612" width="16" height="74" rx="3" fill="' + osc(camisa, 0.9) + '"/><circle cx="0" cy="-594" r="4" fill="#f5f5f5"/><circle cx="0" cy="-568" r="4" fill="#f5f5f5"/>';
  }
  // Chaleco acolchado
  if (o.chaleco) {
    const ch = o.chaleco;
    const fCh = gl(P('gch'), acl(ch, 0.14), osc(ch, 0.7));
    DEFS.push('<clipPath id="' + P('cch') + '"><path d="M-108,-600 Q-116,-566 -98,-522 L-82,-398 L-4,-398 L-4,-630 Q-56,-626 -108,-600 Z"/><path d="M108,-600 Q116,-566 98,-522 L82,-398 L4,-398 L4,-630 Q56,-626 108,-600 Z"/></clipPath>');
    s += '<g clip-path="url(#' + P('cch') + ')"><rect x="-130" y="-640" width="260" height="250" fill="' + fCh + '"/>';
    for (let y = -600; y < -400; y += 30) s += '<path d="M-120,' + y + ' Q-60,' + (y + 8) + ' 0,' + y + ' Q60,' + (y + 8) + ' 120,' + y + '" stroke="' + osc(ch, 0.55) + '" stroke-width="3" fill="none"/>';
    s += '</g><line x1="0" y1="-630" x2="0" y2="-400" stroke="#c9ced8" stroke-width="4"/>';
    s += '<path d="M-48,-650 Q0,-660 48,-650 L44,-624 Q0,-634 -44,-624 Z" fill="' + osc(ch, 0.85) + '"/>';
  }
  // Chupa de cuero
  if (o.cuero) {
    const fCu = gl(P('gcu'), '#3a3a3a', '#0c0c0c');
    const panel = '<path d="M-114,-604 Q-126,-566 -106,-522 L-86,-398 L-30,-398 L-36,-610 Q-72,-628 -114,-604 Z" fill="' + fCu + '"/><path d="M-36,-610 L-64,-560 L-40,-516 Z" fill="#2f2f2f"/><circle cx="-90" cy="-590" r="5" fill="#cfcfcf"/><circle cx="-74" cy="-598" r="5" fill="#cfcfcf"/><circle cx="-58" cy="-604" r="5" fill="#cfcfcf"/>';
    s += panel + mirror(panel);
    s += '<path d="M-20,-640 Q0,-600 20,-640" stroke="#b8b8b8" stroke-width="4" fill="none"/>';
    s += '<path d="M-14,-560 l26,-38 l-8,30 l20,0 l-28,44 l8,-36 z" fill="#c62828"/>';
  }
  // Cuello del polo (encima del chaleco)
  if (o.polo && !o.cuero) {
    const c = '<path d="M-44,-636 L-6,-604 L-30,-578 L-56,-622 Z" fill="' + acl(camisa, 0.15) + '" stroke="' + osc(camisa, 0.72) + '" stroke-width="2"/>';
    s += c + mirror(c);
  }
  // Jersey anudado a los hombros
  if (o.jersey) {
    const j = o.jersey, fJ = gl(P('gj'), acl(j, 0.18), osc(j, 0.72));
    s += '<path d="M-126,-606 Q0,-672 126,-606 Q122,-580 106,-574 Q0,-632 -106,-574 Q-122,-580 -126,-606 Z" fill="' + fJ + '"/>';
    const m = '<path d="M-66,-596 Q-24,-566 -10,-546 Q-6,-522 -16,-470 L-34,-472 Q-26,-520 -32,-540 Q-50,-562 -82,-588 Z" fill="' + fJ + '"/><path d="M-34,-480 L-16,-478" stroke="' + osc(j, 0.6) + '" stroke-width="5"/>';
    s += m + mirror(m) + '<ellipse cx="0" cy="-552" rx="26" ry="18" fill="' + osc(j, 0.9) + '"/>';
  }
  // Collar plateado de los heavies
  if (o.cuero && o.cadena) s += '<path d="M-30,-632 Q0,-596 30,-632" stroke="#d8d8d8" stroke-width="5" fill="none" stroke-dasharray="6 5"/>';

  // Cabeza (gira en el cuello)
  let c = '';
  if (o.peinado === 'melena') c += '<path d="M-74,-30 Q-96,90 -84,170 L84,170 Q96,90 74,-30 Q0,-120 -74,-30 Z" fill="' + fPelo + '"/>';
  c += '<ellipse cx="-63" cy="4" rx="13" ry="19" fill="' + pielS + '"/><ellipse cx="63" cy="4" rx="13" ry="19" fill="' + pielS + '"/>';
  c += '<ellipse cx="0" cy="0" rx="63" ry="80" fill="' + fPiel + '"/>';
  c += '<path d="M-54,30 Q0,98 54,30 Q0,84 -54,30 Z" fill="' + osc(piel, 0.86) + '" opacity=".45"/>';
  c += '<ellipse cx="-34" cy="30" rx="13" ry="8" fill="#e8707a" opacity=".22"/><ellipse cx="34" cy="30" rx="13" ry="8" fill="#e8707a" opacity=".22"/>';
  if (o.barba) c += '<path d="M-62,4 Q-64,76 0,94 Q64,76 62,4 Q50,46 26,48 Q0,36 -26,48 Q-50,46 -62,4 Z" fill="' + fPelo + '"/>';
  // Ojos
  c += '<ellipse cx="-23" cy="-6" rx="13" ry="10" fill="#fff"/><ellipse cx="23" cy="-6" rx="13" ry="10" fill="#fff"/>';
  c += '<g id="' + P('pup') + '"><circle cx="-23" cy="-5" r="7" fill="' + (o.ojos || '#4b3621') + '"/><circle cx="23" cy="-5" r="7" fill="' + (o.ojos || '#4b3621') + '"/><circle cx="-23" cy="-5" r="3.4" fill="#111"/><circle cx="23" cy="-5" r="3.4" fill="#111"/><circle cx="-20.5" cy="-7.5" r="1.8" fill="#fff"/><circle cx="25.5" cy="-7.5" r="1.8" fill="#fff"/></g>';
  c += '<path d="M-37,-12 Q-23,-20 -9,-12 M9,-12 Q23,-20 37,-12" stroke="' + osc(piel, 0.55) + '" stroke-width="3" fill="none"/>';
  const ceja = osc(o.pelo, 0.8);
  c += '<g id="' + P('cejI') + '"><path d="M-40,-30 Q-24,-40 -8,-31" stroke="' + ceja + '" stroke-width="7" fill="none" stroke-linecap="round"/></g>';
  c += '<g id="' + P('cejD') + '"><path d="M8,-31 Q24,-40 40,-30" stroke="' + ceja + '" stroke-width="7" fill="none" stroke-linecap="round"/></g>';
  c += '<path d="M-2,-2 Q-9,22 -3,28 Q4,32 10,27" stroke="' + osc(piel, 0.66) + '" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
  // Bocas
  const dientes = '<path d="M-13,46 Q0,45 13,46 L12,51 Q0,50 -12,51 Z" fill="#fff"/>';
  c += '<g id="' + P('mN') + '"><path d="M-18,50 Q0,58 18,50" stroke="#7a2e2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>';
  c += '<g id="' + P('mA') + '" opacity="0"><path d="M-17,45 Q0,43 17,45 Q13,68 0,70 Q-13,68 -17,45 Z" fill="#5a1e1e"/>' + dientes + '</g>';
  c += '<g id="' + P('mO') + '" opacity="0"><ellipse cx="0" cy="56" rx="11" ry="15" fill="#5a1e1e"/></g>';
  c += '<g id="' + P('mG') + '" opacity="0"><path d="M-28,42 Q0,48 28,42 Q22,76 0,78 Q-22,76 -28,42 Z" fill="#5a1e1e"/><path d="M-24,43 Q0,48 24,43 L22,51 Q0,55 -22,51 Z" fill="#fff"/></g>';
  c += '<g id="' + P('mP') + '" opacity="0"><path d="M-18,58 Q0,46 18,58" stroke="#7a2e2e" stroke-width="5" fill="none" stroke-linecap="round"/></g>';
  // Pelo (delante)
  if (o.peinado === 'tupe') {
    c += '<path d="M-68,-6 Q-78,-74 -42,-102 Q2,-140 54,-114 Q86,-94 70,-16 Q64,-58 34,-68 Q-4,-82 -38,-62 Q-60,-46 -68,-6 Z" fill="' + fPelo + '"/>';
    c += '<path d="M-34,-96 Q8,-120 50,-100 M-44,-78 Q0,-102 56,-84 M-20,-112 Q20,-128 52,-110" stroke="' + acl(o.pelo, 0.45) + '" stroke-width="4" fill="none" opacity=".7"/>';
  } else if (o.peinado === 'raya') {
    c += '<path d="M-68,-2 Q-74,-84 -10,-96 Q62,-104 72,-28 L68,-2 Q60,-56 22,-66 L-18,-68 Q-54,-62 -68,-2 Z" fill="' + fPelo + '"/>';
    c += '<path d="M-22,-92 L-26,-66" stroke="' + acl(o.pelo, 0.4) + '" stroke-width="4"/><path d="M0,-90 Q36,-90 56,-60 M6,-80 Q34,-80 50,-56" stroke="' + acl(o.pelo, 0.35) + '" stroke-width="3" fill="none" opacity=".7"/>';
  } else if (o.peinado === 'cresta') {
    c += '<path d="M-64,-10 Q-66,-70 0,-82 Q66,-70 64,-10 Q58,-54 0,-62 Q-58,-54 -64,-10 Z" fill="' + osc(piel, 0.6) + '" opacity=".35"/>';
    c += '<path d="M-18,-72 L-26,-126 L-10,-104 L-12,-168 L2,-120 L8,-184 L14,-116 L26,-156 L20,-76 Z" fill="' + o.pelo + '"/>';
  } else if (o.peinado === 'melena') {
    c += '<path d="M-68,6 Q-72,-84 0,-94 Q72,-84 68,6 Q58,-52 8,-66 L0,-44 L-8,-66 Q-58,-52 -68,6 Z" fill="' + fPelo + '"/>';
    if (o.diadema) c += '<path d="M-62,-48 Q0,-96 62,-48" stroke="' + o.diadema + '" stroke-width="10" fill="none"/>';
  } else if (o.peinado === 'rapado') {
    c += '<path d="M-64,-14 Q-66,-78 0,-86 Q66,-78 64,-14 Q58,-58 0,-66 Q-58,-58 -64,-14 Z" fill="' + o.pelo + '" opacity=".85"/>';
  }
  if (o.gafas) c += '<g transform="translate(0,-92)"><ellipse cx="-26" cy="0" rx="22" ry="13" fill="#141414"/><ellipse cx="26" cy="0" rx="22" ry="13" fill="#141414"/><path d="M-6,-2 L6,-2" stroke="#141414" stroke-width="5"/><ellipse cx="-32" cy="-4" rx="7" ry="3" fill="#fff" opacity=".35"/></g>';
  s += '<g id="' + P('cab') + '"><g transform="translate(0,-738)">' + c + '</g></g>';
  return s;
}

// Personajes base
const BOSCO = { piel: '#E8B08A', pelo: '#D9B160', peinado: 'tupe', camisa: '#8EC3EE', polo: true, chaleco: '#1F2D4D', pantalon: '#D6C29A', gafas: true, ojos: '#3d6fa8' };
const BORJA = { piel: '#F1C6A4', pelo: '#5B3A22', peinado: 'raya', camisa: '#F6B8C0', polo: true, jersey: '#23335E', pantalon: '#A3302F', ojos: '#5a3d22' };
const HEAVY1 = { piel: '#E2A882', pelo: '#D62828', peinado: 'cresta', cuero: true, pantalon: '#1d1d1d', zapato: 'bota', cadena: true, ojos: '#2f4f2f' };
const HEAVY2 = { piel: '#D79C74', pelo: '#1a1412', peinado: 'melena', cuero: true, barba: true, pantalon: '#232323', zapato: 'bota' };
const HEAVY3 = { piel: '#B98262', pelo: '#2a2a2a', peinado: 'rapado', cuero: true, barba: true, pantalon: '#1f1f1f', zapato: 'bota', cadena: true };
const CAMARERO = { piel: '#E0A47E', pelo: '#141010', peinado: 'melena', camisa: '#1b1b1b', camiseta: true, tatuajes: true, barba: true, pantalon: '#1e1e1e', zapato: 'bota' };

function ventanas(x0, y0, cols, filas, w, h, gx, gy, semilla) {
  let s = '';
  for (let f = 0; f < filas; f++) for (let k = 0; k < cols; k++) {
    const r = Math.abs(Math.sin((f * 7 + k * 13 + semilla) * 12.9898)) % 1;
    const luz = r > 0.45;
    s += '<rect x="' + (x0 + k * gx) + '" y="' + (y0 + f * gy) + '" width="' + w + '" height="' + h + '" rx="3" fill="' + (luz ? '#f3d58a' : '#1a2140') + '" opacity="' + (luz ? 0.9 : 1) + '"/>';
    if (luz) s += '<rect x="' + (x0 + k * gx) + '" y="' + (y0 + f * gy) + '" width="' + w + '" height="' + h + '" rx="3" fill="#ffe7a8" opacity=".4" filter="url(#blur8)"/>';
    s += '<path d="M' + (x0 + k * gx - 6) + ',' + (y0 + f * gy + h + 6) + ' h' + (w + 12) + '" stroke="#0c1124" stroke-width="5"/>';
  }
  return s;
}

// ================= Ayudas de animación =================
function boca(id, cual) { ['mN', 'mA', 'mO', 'mG', 'mP'].forEach((m) => { const e = $(id + '-' + m); if (e) e.setAttribute('opacity', m === cual ? 1 : 0); }); }
function mirar(id, dx, dy) { $(id + '-pup').setAttribute('transform', 'translate(' + dx + ',' + dy + ')'); }
function brazo(id, lado, ang) {
  const px = lado === 'bI' ? -108 : 108;
  $(id + '-' + lado).setAttribute('transform', 'rotate(' + ang + ',' + px + ',-590)');
}
function cabeza(id, ang, dy = 0) { $(id + '-cab').setAttribute('transform', 'translate(0,' + dy + ') rotate(' + ang + ',0,-650)'); }
function cejas(id, dI, dD) {
  $(id + '-cejI').setAttribute('transform', 'translate(0,' + dI + ')');
  $(id + '-cejD').setAttribute('transform', 'translate(0,' + dD + ')');
}
function mover(id, x, y, k, flip) {
  const c = C[id];
  $(id).setAttribute('transform', 'translate(' + (x ?? c.x) + ',' + (y ?? c.y) + ') scale(' + (flip ? -1 : 1) * (k ?? c.k) + ',' + (k ?? c.k) + ')');
}
// ¿Está hablando ahora? Devuelve true si la boca debe ir abierta en este fotograma.
function hablando(t, id) {
  for (const l of LINEAS) {
    if (l.c !== id) continue;
    const r = t - l.t;
    if (r < 0 || r > 6) continue;
    if (l.pausas.some(([a, b]) => r >= a && r < b)) return false;
    return Math.floor(r * 9) % 2 === 0;
  }
  return false;
}
function escena(id, t, a, b) { $(id).style.opacity = Math.min(fade(t, a, a + 0.35), 1 - fade(t, b - 0.35, b)); }

  brazo('cam', 'bI', 0); brazo('cam', 'bD', 0);
  $('vaso').setAttribute('opacity', fade(t, 18.9, 19.2));
  $('burbuja').style.opacity = fade(t, 20.0, 20.2) * (1 - fade(t, 22.5, 22.8));
  $('burbuja').style.transform = 'scale(' + (0.85 + 0.15 * suave(fade(t, 20.0, 20.3))) + ')';
  $('cri').style.opacity = fade(t, 20.6, 20.9) * (1 - fade(t, 22.3, 22.6));

  // ---- 4. Bosco saca el móvil ----
  boca('c4bosco', hablando(t, 'c4bosco') ? 'mA' : 'mN');
  mirar('c4bosco', fade(t, 23.4, 23.8) * 6, fade(t, 23.4, 23.8) * 5);
  $('movil').setAttribute('opacity', fade(t, 23.2, 23.5));
  $('movil').setAttribute('transform', 'translate(0,' + (1 - suave(fade(t, 23.2, 23.7))) * 260 + ')');
  const luz = fade(t, 24.8, 25.0);
  $('pant').setAttribute('fill', luz > 0 ? '#ff5ab4' : '#111628');
  $('brillo').setAttribute('opacity', 0.35 * luz);
  brazo('c4bosco', 'bD', 0); brazo('c4bosco', 'bI', 0);

  // ---- 5. Mapa del móvil ----
  PINS.forEach((p) => { p.el.style.transform = 'translate(-50%,-50%) scale(' + fade(t, p.t, p.t + 0.2) + ')'; });
  $('t5a').style.opacity = fade(t, 26.6, 26.9);
  $('t5b').style.opacity = fade(t, 27.4, 27.7);
  $('t5c').style.opacity = fade(t, 27.9, 28.2);

  // ---- 6. La Terraza ----
  PIJOS.forEach((o, i) => {
    const id = 'p' + i;
    mover(id, null, 1500 - Math.abs(Math.sin(t * 7.8 + i)) * 18);
    brazo(id, 'bI', 120 + Math.sin(t * 7.8 + i) * 25); brazo(id, 'bD', -120 - Math.sin(t * 7.8 + i * 2) * 25);
    boca(id, 'mG'); mirar(id, 0, -2);
  });
  const fiesta = suave(fade(t, 30.4, 30.9));
  ['c6borja', 'c6bosco'].forEach((c, i) => {
    mover(c, null, 1890 - Math.abs(Math.sin(t * 7.8 + i)) * 22 * fiesta);
    brazo(c, 'bI', 150 * fiesta + Math.sin(t * 7.8) * 12 * fiesta); brazo(c, 'bD', -150 * fiesta - Math.sin(t * 7.8) * 12 * fiesta);
    boca(c, hablando(t, c) ? 'mA' : 'mG');
    cejas(c, -6 * fiesta, -6 * fiesta);
  });

  // ---- 7. Cierre ----
  $('logo').style.opacity = fade(t, 34.0, 34.6);
  $('etiqueta').style.opacity = fade(t, 36.6, 37.0);
  $('etiqueta').style.transform = 'scale(' + (0.9 + 0.1 * suave(fade(t, 36.6, 37.0))) + ')';
  $('flecha').style.opacity = fade(t, 37.0, 37.3);
  $('flecha').style.transform = 'translateY(' + (Math.sin(t * 6) * 14) + 'px)';
  $('arroba').style.opacity = fade(t, 37.6, 38.0);
  ['c7borja', 'c7bosco'].forEach((c, i) => {
    brazo(c, i ? 'bD' : 'bI', (i ? -1 : 1) * (130 + Math.sin(t * 9) * 25));
    boca(c, 'mG');
  });

  // ---- Subtítulos ----
  let li = -1;
  LINEAS.forEach((l, i) => { if (t >= l.t - 0.05 && t < l.t + DUR[i] + 0.1) li = i; });
  const sub = $('sub');
  if (li < 0) { sub.style.opacity = 0; }
  else {
    const l = LINEAS[li];
    if (sub.dataset.i !== String(li)) {
      sub.dataset.i = li;
      sub.querySelector('.q').textContent = l.q;
      sub.querySelector('.q').style.color = COLQ[l.q];
      sub.querySelector('.t').textContent = l.txt;
    }
    sub.style.opacity = fade(t, l.t - 0.05, l.t + 0.2) * (1 - fade(t, l.t + DUR[li] - 0.1, l.t + DUR[li] + 0.1));
  }
}
window.pintar = pintar;
pintar(0);
</script>
</body>
</html>
